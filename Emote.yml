name: Emote
displayField: Name
fields:
  - name: Name
  - name: Icon
    type: icon
  - name: UnlockLink
  - name: TextCommand
    type: link
    targets: [TextCommand]
  - name: ActionTimeline
    type: array
    count: 7
    fields:
      - type: link
        targets: [ActionTimeline]
    comment: |
      0 = Standing
      1 = Start animation
      2 = Ground sit
      3 = Chair sit
      4 = Mounted / Swimming / Diving
      5 = Dozing
      6 = Unused
  - name: Order
  - name: LogMessageTargeted
    type: link
    targets: [LogMessage]
  - name: LogMessageUntargeted
    type: link
    targets: [LogMessage]
  - name: Patch
  - name: EmoteCategory
    type: link
    targets: [EmoteCategory]
    comment: |
      3 (Expressions) = Usable everywhere (other columns are overridden)
  - name: EmoteMode
    type: link
    targets: [EmoteMode]
  - name: UsableWhenMounted
  - name: UsableWhenSwimming
  - name: UsableWhenDiving
  - name: DontSetEmoteMode
  - name: Unknown5
    comment: Maybe controls whether or not the emote can be synced in GPose?!
  - name: UsableWhenFishing
  - name: DrawsWeapon
  - name: SheathesWeapon
